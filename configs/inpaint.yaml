model: ffhq
checkpoint: checkpoints/ffhq256.pt
data:
  root: data/ffhq256
  kind: images
  resolution: 256
  ids: '0'
operator:
  kind: inpaint
  resolution: 256
  mask_len_range: [105, 180]
noise:
  name: gaussian
  sigma_noise: 0.1
  df: 2.2
  outlier_fraction: 0.01
  outlier_magnitude_factor: 30.0
guidance:
  kind: none
  quantile: 0.95
  power: 1
  per_sample: true
