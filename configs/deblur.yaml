model: ffhq
checkpoint: checkpoints/ffhq256.pt
data:
  root: data/ffhq256
  kind: images
  resolution: 256
  ids: '0'
operator:
  kind: deblur
  resolution: 256
  kernel_size: 61
  intensity: 3.0
noise:
  name: gaussian
  sigma_noise: 0.05
  df: 2.2
  outlier_fraction: 0.05
  outlier_magnitude_factor: 30.0
guidance:
  kind: none
  quantile: 0.95
  power: 1
